[package]
name = "surface-saver-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.18"
walkdir = "2.5"
# TODO: Re-enable when rmcp API stabilizes
# rmcp = { version = "0.3.1", features = ["server", "transport-io"] }
# rmcp-macros = { version = "0.3.1" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.10"
